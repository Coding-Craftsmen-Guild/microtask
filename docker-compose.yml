# CC Guild: the API, Microtask and Macroplan, one image each (ADR 0026). Read README.md "Deploy" first.
#
# THIS IS NOT THE CUTOVER, AND IT STILL CANNOT READ PRODUCTION DATA. The API starts on its own,
# new, empty volume (api-data). The live app's volume holds data/projects/<id>.json, a layout this
# API cannot read; the only path from that layout to this one is the importer (ADR 0017).
#
# The importer now exists (2026-09-17), and that changes which gate you are standing at, not
# whether there is one. What is lifted is the code gate. What remains is the sequence, and it is
# the half that can lose production: backup, deploy, import, and only then the hostname (ADR 0022).
# So the rules are unchanged — never mount the live volume here, never give this stack the
# production hostname before the import, never point it at this repository's data/ directory. The
# live volume is the rollback, so nothing in this file may ever write to it.
#
# The service below is named `microtask`, which is the live app's service name too. Coolify keys
# domains by service name, so a deploy of this file onto the production resource can carry the
# production domain to this new, empty stack. Auto-deploy must be off on that resource before
# `main` moves. See README "Deploy".
#
# Macroplan is a third service on its own hostname, never the production one (ADR 0022). It holds
# its own service key and its own cookie secret: one key per product is what lets the API record
# which product made a call, and two cookie names are what let both apps be signed into from one
# browser without each clearing the other's session (ADR 0014).
#
# Every secret comes from the environment and has no default: a missing one stops `docker compose`
# before any container starts. Each app's API key is handed to the API as part of SERVICE_KEYS and
# to that app as its own API_KEY, so the two cannot drift apart.
#
# The API is internal-only (ADR 0041): `expose`, never `ports`, and no domain. The apps reach it by
# service name. No service publishes a port; Coolify routes by domain (ADR 0026).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set, at least 32 characters}
      BRIDGE_SECRET: ${BRIDGE_SECRET:?BRIDGE_SECRET must be set, at least 32 characters}
      SERVICE_KEYS: microtask=${MICROTASK_API_KEY:?MICROTASK_API_KEY must be set},macroplan=${MACROPLAN_API_KEY:?MACROPLAN_API_KEY must be set}
    volumes:
      - api-data:/data
    expose:
      - '4321'

  microtask:
    build:
      context: .
      dockerfile: apps/microtask/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:4321
      API_KEY: ${MICROTASK_API_KEY:?MICROTASK_API_KEY must be set}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set, at least 32 bytes}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must be set, a base64 AES-256 key kept stable across deploys}
    expose:
      - '3000'

  macroplan:
    build:
      context: .
      dockerfile: apps/macroplan/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:4321
      API_KEY: ${MACROPLAN_API_KEY:?MACROPLAN_API_KEY must be set}
      COOKIE_SECRET: ${MACROPLAN_COOKIE_SECRET:?MACROPLAN_COOKIE_SECRET must be set, at least 32 bytes and not Microtask's}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${MACROPLAN_SERVER_ACTIONS_ENCRYPTION_KEY:?MACROPLAN_SERVER_ACTIONS_ENCRYPTION_KEY must be set, a base64 AES-256 key kept stable across deploys}
    expose:
      - '3000'

volumes:
  api-data:
