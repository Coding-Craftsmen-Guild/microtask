# CC Guild: the API and Microtask, one image each (ADR 0026). Read README.md "Deploy" first.
#
# THIS IS NOT THE CUTOVER, AND IT CANNOT READ PRODUCTION DATA. The API starts on its own, new,
# empty volume (api-data). The live app's volume holds data/projects/<id>.json, a layout this API
# cannot read; the only path from that layout to this one is the importer (ADR 0017), which is
# scheduled last and does not exist yet. Until it does, cutover is blocked: never mount the live
# volume here and never give this stack the production hostname (ADR 0022). The live volume is the
# rollback, so nothing in this file may ever write to it.
#
# Every secret comes from the environment and has no default: a missing one stops `docker compose`
# before any container starts. MICROTASK_API_KEY is the one service key, handed to the API as
# SERVICE_KEYS and to the app as API_KEY, so the two cannot drift apart.
#
# The API is internal-only (ADR 0041): `expose`, never `ports`, and no domain. The app reaches it by
# service name. Neither service publishes a port; Coolify routes by domain (ADR 0026).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set, at least 32 characters}
      SERVICE_KEYS: microtask=${MICROTASK_API_KEY:?MICROTASK_API_KEY must be set}
    volumes:
      - api-data:/data
    expose:
      - '4321'

  microtask:
    build:
      context: .
      dockerfile: apps/microtask/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:4321
      API_KEY: ${MICROTASK_API_KEY:?MICROTASK_API_KEY must be set}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set, at least 32 bytes}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must be set, a base64 AES-256 key kept stable across deploys}
    expose:
      - '3000'

volumes:
  api-data:
