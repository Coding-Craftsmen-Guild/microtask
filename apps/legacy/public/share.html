<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Project · CC Guild Microtask</title>
    <link rel="icon" href="/img/logo.webp" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-inner">
        <span class="brand">
          <img src="/img/logo.webp" alt="CC Guild logo" />
          <span class="brand-text">
            <span class="brand-name">Microtask</span>
            <span class="brand-sub">CC Guild</span>
          </span>
        </span>
        <span class="spacer"></span>
        <span class="appbar-link" id="status"></span>
      </div>
    </header>

    <main class="wrap">
      <div class="client-head">
        <h1 id="title">…</h1>
        <div class="sub" id="overall"></div>
      </div>

      <div class="tabbar" id="tabbar"></div>
      <div class="editor-shell" id="shell">
        <div class="toolbar" id="toolbar"></div>
        <div class="tab-progress" id="tab-progress"></div>
        <div class="doc" id="doc"></div>
      </div>
    </main>

    <script type="module" src="/js/share.js"></script>
  </body>
</html>
