packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ reads its own settings from this file, not from .npmrc. The
# hyphenated .npmrc spellings these two replace were read by nothing, so
# `pnpm config get strict-peer-dependencies` answered undefined and no peer
# range in the workspace was ever checked. autoInstallPeers stays false: with
# it on pnpm invents a peer version instead of failing, which is the same
# blind spot with extra steps. .npmrc is deleted because it held only these
# two keys and no npm-registry settings.
strictPeerDependencies: true
autoInstallPeers: false

# Workspace-wide, not per-package. esbuild's postinstall only fetches its
# native binary, which already arrives as an optional @esbuild/<platform>
# dependency, so skipping the script is safe. Nothing installs esbuild today:
# the legacy app was the only package that depended on it, and vite 8 declares
# it as an OPTIONAL peer, which autoInstallPeers: false leaves uninstalled -
# `pnpm why -r esbuild` answers nothing. The entry stays so that the day
# something brings esbuild back (vite's optional peer, or a tool built on it),
# its install script is already decided rather than blocking the install.
allowBuilds:
  esbuild: false

catalog:
  zod: 4.6.1
  typescript: 5.9.3
  eslint: 9.39.5
  vitest: 5.0.0
  '@types/node': 22.20.2

  # vitest@5.0.0 takes vite as a non-optional peer (^6.4.0 || ^7.0.0 || ^8.0.0)
  # and no package declared it, so the first install that actually read
  # strictPeerDependencies failed on it. 8.2.2 is the version the tree was
  # already resolving transitively; 8.3.0 is one day old.
  vite: 8.2.2

  # react and react-dom move as one pin: react-dom@19.3.0 declares peer
  # react@^19.3.0, so bumping either alone fails strict-peer-dependencies.
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

  next: 16.3.4

  # tailwindcss must equal @tailwindcss/postcss: the plugin takes the former as
  # an exact (not ranged) dependency, so a mismatch installs two Tailwinds and
  # the copy that scans @source is not the copy the plugin runs.
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3

  # Every @tiptap/* v3 package peer-pins its siblings to the literal string
  # 3.31.3 - not a range - so the set moves as one unit or not at all:
  # @tiptap/core peers @tiptap/pm 3.31.3, @tiptap/react peers both, and so do
  # @tiptap/extension-list and @tiptap/extensions. Bumping one alone fails
  # strictPeerDependencies. In v3 the task list lives in @tiptap/extension-list
  # (TaskList, TaskItem) and Placeholder lives in @tiptap/extensions; the
  # extension-task-list / -task-item / -placeholder shim packages are not
  # needed. @tiptap/html is deliberately absent: it takes happy-dom as a
  # non-optional peer, and @tiptap/core already exports generateHTML and
  # generateJSON. The editor belongs to apps/microtask, never packages/ui,
  # because a shared Tiptap risks two prosemirror copies. The Tiptap 2 specs
  # the deleted legacy app carried survive only at the legacy-prod tag.
  '@tiptap/core': 3.31.3
  '@tiptap/pm': 3.31.3
  '@tiptap/starter-kit': 3.31.3
  '@tiptap/react': 3.31.3
  '@tiptap/extension-list': 3.31.3
  '@tiptap/extensions': 3.31.3

  # Component tests. happy-dom is one of vitest's optional environment peers;
  # the @testing-library packages are pinned here so every app and packages/ui
  # agree on one copy of each. @testing-library/dom is a NON-optional peer of
  # both the other two (react wants ^10.0.0, user-event wants >=7.21.4), so it
  # is a catalogue entry rather than a literal in one package: with
  # strictPeerDependencies armed and autoInstallPeers off, whoever declares a
  # testing-library dependency must declare it too, and they must agree.
  happy-dom: 20.14.3
  '@testing-library/dom': 10.4.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7

minimumReleaseAgeExclude:
  - eslint-plugin-jsdoc@64.3.9
  - zod@4.6.1
  - '@types/node@22.20.2'
  - lucide-react@1.44.0

overrides:
  zod: 'catalog:'
