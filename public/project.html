<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project · CC Guild Microtask</title>
    <link rel="icon" href="/img/logo.webp" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand" href="/">
          <img src="/img/logo.webp" alt="CC Guild logo" />
          <span class="brand-text">
            <span class="brand-name">Microtask</span>
            <span class="brand-sub">CC Guild</span>
          </span>
        </a>
        <span class="spacer"></span>
      </div>
    </header>

    <main class="wrap">
      <a class="back" href="/">← Projects</a>

      <div class="project-title-row">
        <h1 class="project-title" id="title" contenteditable="plaintext-only" spellcheck="false"></h1>
        <span class="spacer" style="flex:1"></span>
        <span id="overall"></span>
        <button class="btn btn-gold" id="share-btn">Share</button>
      </div>

      <div class="tabbar" id="tabbar"></div>

      <div class="editor-shell">
        <div class="toolbar" id="toolbar"></div>
        <div class="tab-progress" id="tab-progress"></div>
        <div class="doc" id="doc"></div>
      </div>
    </main>

    <dialog id="share-dialog" class="wide">
      <div class="body">
        <h2>Share this project</h2>
        <p class="hint">
          One link per person. Everyone sees the same tabs — editors can change the content,
          viewers can only read it. Nobody can add, rename or delete tabs.
        </p>

        <form class="share-new" id="share-new">
          <input type="text" name="name" placeholder="Who is this link for? e.g. Jane at ACME" maxlength="80" />
          <select name="permission" class="select">
            <option value="read">Read only</option>
            <option value="write">Read &amp; write</option>
          </select>
          <button class="btn btn-primary" type="submit">Add link</button>
        </form>

        <div id="share-links"></div>

        <div class="actions">
          <button class="btn" type="button" id="share-close">Done</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/js/project.js"></script>
  </body>
</html>
